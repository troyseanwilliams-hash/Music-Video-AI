kind = "web"
previewPath = "/aisync-suite/"
title = "AISyncSuite Company Site"
description = "A polished public company website for AISyncSuite, presenting its AI-powered media and workflow products with clear positioning, product storytelling, and contact pathways."
version = "1.0.0"
id = "artifacts/aisync-suite"
router = "path"

[[services]]
name = "web"
paths = [ "/aisync-suite/" ]
localPort = 24613

[services.development]
run = "pnpm --filter @workspace/aisync-suite run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aisync-suite", "run", "build" ]
serve = "static"
publicDir = "artifacts/aisync-suite/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24613"
BASE_PATH = "/aisync-suite/"
