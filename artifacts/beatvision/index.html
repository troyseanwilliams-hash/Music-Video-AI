<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme boot: apply saved theme before first paint (default: dark) -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("bv-theme") === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- Primary Meta -->
    <title>AIBeatSync — AI Music Video & Narration Generator</title>
    <meta name="description" content="AIBeatSync is an AI video studio for musicians and creators. Turn your audio into beat-synced cinematic visuals and narrated stories. Try it today." />
    <meta name="keywords" content="AI music video generator, beat sync video, audio reactive video, AI video from music, music visualization AI, AI music video maker, automatic music video, AI generated music video, beat synced visuals, music to video AI, narration generator" />
    <meta name="author" content="AIBeatSync" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#FF3C00" />
    <link rel="canonical" href="https://aibeatsync.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aibeatsync.com/" />
    <meta property="og:site_name" content="AIBeatSync" />
    <meta property="og:title" content="AIBeatSync — Turn Your Music Into Cinematic AI Videos" />
    <meta property="og:description" content="Upload any song and our AI creates stunning, beat-synced music videos. 8 cinematic styles. Realistic, anime, neon & more." />
    <meta property="og:image" content="https://aibeatsync.com/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AIBeatSync — AI Music Video Generator" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@aibeatsync" />
    <meta name="twitter:title" content="AIBeatSync — Turn Your Music Into Cinematic AI Videos" />
    <meta name="twitter:description" content="Upload any song and our AI creates stunning, beat-synced music videos. 8 cinematic styles." />
    <meta name="twitter:image" content="https://aibeatsync.com/opengraph.jpg" />
    <meta name="twitter:image:alt" content="AIBeatSync — AI Music Video Generator" />

    <!-- Icons & PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- JSON-LD Structured Data -->

      "@context": "https://schema.org",

        {
          "@type": "WebApplication",
          "@id": "https://aibeatsync.com/#webapp",

        },

          "@type": "Organization",

          "url": "https://aibeatsync.com",

  </head>
