    <!-- Theme boot: apply saved theme before first paint (default: dark) -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("bv-theme") === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
