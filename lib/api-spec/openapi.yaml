        objectPath:
          type: string
          description: Object storage path of the uploaded audio file (e.g. /objects/uploads/uuid.mp3)

    JobStatus:
      type: string
      enum: [pending_approval, queued, analyzing, generating, stitching, ready, failed]

    VideoStyle:
      type: string
      enum: [realistic, anime, cinematic, abstract, neon, vintage, fantasy, documentary]

    AudioAnalysis:
      type: object
      properties:
        analysisReceipt:
          type: string
          maxLength: 512
          description: Server-signed receipt binding this analysis to the authenticated user and stored audio object
        bpm:
          type: [number, 'null']
        key:
          type: [string, 'null']
        energy:
          type: [number, 'null']
        mood:
          type: [string, 'null']
        durationSeconds:
          type: [number, 'null']
        beatTimestamps:
          type: array
          items:
            type: number
        beatGrid:
          type: array
          description: Regular beat positions used to align generated cuts with the analyzed track
          items:
            type: number
        sections:
          type: array
          items:
            type: object
            properties:
              startTime:
                type: number
              endTime:
                type: number
              label:
                type: string
              energy:
                type: number
            required: [startTime, endTime, label, energy]

    Job:
      type: object
      required: [id, userId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        jobType:
          type: [string, 'null']
          description: Processing flow used for this job, such as editor_render for a Remix Lab export or image_pack for a reusable still set
        aiProvider:
          type: [string, 'null']
          enum: [runway, kling, kling_v4, kling_direct, luma, null]
        resolution:
          type: [string, 'null']
          enum: ['720p', '1080p', '4k', null]
        status:
          $ref: '#/components/schemas/JobStatus'
        audioSourceType:
          type: [string, 'null']
          enum: [upload, youtube, suno, none, null]
        audioObjectPath:
          type: [string, 'null']
        audioSourceUrl:
          type: [string, 'null']
        prompt:
          type: [string, 'null']
        style:
          type: [string, 'null']
        aspectRatio:
          type: [string, 'null']
          enum: ['16:9', '9:16', '1:1', '4:3', '21:9', null]
        audioAnalysis:
          oneOf:
            - $ref: '#/components/schemas/AudioAnalysis'
            - type: 'null'
        progressPercent:
          type: [integer, 'null']
        errorMessage:
          type: [string, 'null']
        videoId:
          type: [string, 'null']
        clips:
          type: array
          description: Per-clip metadata for the finished video (present when status is ready). Used by the remix UI to list individual clips.
          items:
            $ref: '#/components/schemas/VideoClip'
        lyricsText:
          type: [string, 'null']
        referenceImagePath:
          type: [string, 'null']
          description: Object storage path for an optional reference image
        requestedDuration:
          type: [string, 'null']
          enum: ['3', '5', '8', '10', '30', '45', '60', '90', '120', '300', '600', 'full', null]
          description: Requested output video length
        clipStartTime:
          type: [number, 'null']
          minimum: 0
          description: Audio clip start time in seconds; null means start from the beginning
        claimedAt:
          type: [string, 'null']
          format: date-time
          description: Time a worker claimed the job; null while the job is queued
        manifest:
          oneOf:
            - $ref: '#/components/schemas/JobManifest'
            - type: 'null'
        previewClips:
          type: object
          description: Completed scene index to preview URL, present while scenes are generated
          additionalProperties:
            type: string
        videoUrl:
          type: string
          description: Signed or proxied playback URL, present when the finished video is available
        hasAudio:
          type: boolean
          description: Whether the finished render contains a soundtrack
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateImagePackRequest:
      type: object
      required: [prompt, imageCount]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 12000
          description: Visual direction used for every generated image.
        style:
          $ref: '#/components/schemas/VideoStyle'
        imageCount:
          type: integer
          minimum: 1
          maximum: 30
          description: Number of images to generate. Each image costs 7 credits.
        aspectRatio:
          type: string
          enum: ['9:16', '16:9']
          default: '9:16'
          description: Output orientation. Portrait 9:16 is the default.
        referenceImagePath:
          type: string
          nullable: true
          description: Optional private uploaded image used to keep the subject and visual identity consistent across the image pack.
        approvedScenes:
          type: array
          minItems: 1
          maxItems: 30
          description: Exact ordered scene prompts approved by the user from the no-charge planning step.
          items:
            $ref: '#/components/schemas/ImagePackScene'

    PhotoAnimationSource:
      oneOf:
