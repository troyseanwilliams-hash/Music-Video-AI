        limit: { type: integer }

    PublicImageAsset:
      type: object
      description: Stable public generated-image data. Private generation prompts and owner IDs are intentionally omitted.
      required: [id, objectPath, assetIndex, likeCount, liked, createdAt]
      properties:
        id: { type: string }
        objectPath:
          type: string
          description: Object path readable while this image remains public.
        assetIndex:
          type: integer
          description: Zero-based chronological scene position in the source generation.
        style:
          type: [string, 'null']
        likeCount: { type: integer }
        liked: { type: boolean }
        creatorName: { type: [string, 'null'] }
        createdAt:
          type: string
          format: date-time

    PublicImageAssetListResponse:
      type: object
      required: [assets, total, page, limit]
      properties:
        assets:
