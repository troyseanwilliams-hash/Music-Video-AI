openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BeatVision AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Jobs
    description: Music video generation jobs
  - name: Videos
    description: Generated videos gallery
  - name: Credits
    description: User credits and usage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register a new account with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registered and signed in successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Email already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and redirect home
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to home page.

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List all jobs for the current user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: List of jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [Jobs]
      operationId: createJob
      summary: Create a new music video generation job
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job created and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '402':
          description: Insufficient credits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /jobs/{id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get job status and details
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /videos:
    get:
      tags: [Videos]
      operationId: listVideos
      summary: List generated videos for the current user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: List of videos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /videos/{id}:
    get:
      tags: [Videos]
      operationId: getVideo
      summary: Get a specific video
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Video details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Video not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [Videos]
      operationId: deleteVideo
      summary: Delete a video
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Video deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Video not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /credits:
    get:
      tags: [Credits]
      operationId: getCredits
      summary: Get current user's credit balance and usage stats
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Credits info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditsResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /dashboard/stats:
    get:
      tags: [Jobs]
      operationId: getDashboardStats
      summary: Get dashboard summary stats for the current user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Dashboard stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          minLength: 5
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
          maxLength: 100
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'

    JobStatus:
      type: string
      enum: [queued, analyzing, generating, stitching, ready, failed]

    VideoStyle:
      type: string
      enum: [realistic, anime, cinematic, abstract, neon, vintage, fantasy, documentary]

    AudioAnalysis:
      type: object
      properties:
        bpm:
          type: [number, 'null']
        key:
          type: [string, 'null']
        energy:
          type: [number, 'null']
        mood:
          type: [string, 'null']
        durationSeconds:
          type: [number, 'null']
        beatTimestamps:
          type: array
          items:
            type: number
        sections:
          type: array
          items:
            type: object
            properties:
              startTime:
                type: number
              endTime:
                type: number
              label:
                type: string
              energy:
                type: number
            required: [startTime, endTime, label, energy]

    Job:
      type: object
      required: [id, userId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        audioSourceType:
          type: [string, 'null']
          enum: [upload, youtube, suno, null]
        audioObjectPath:
          type: [string, 'null']
        audioSourceUrl:
          type: [string, 'null']
        prompt:
          type: [string, 'null']
        style:
          type: [string, 'null']
        audioAnalysis:
          oneOf:
            - $ref: '#/components/schemas/AudioAnalysis'
            - type: 'null'
        progressPercent:
          type: [integer, 'null']
        errorMessage:
          type: [string, 'null']
        videoId:
          type: [string, 'null']
        lyricsText:
          type: [string, 'null']
        referenceImagePath:
          type: [string, 'null']
          description: Object storage path for an optional reference image
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateJobRequest:
      type: object
      required: [prompt, style, audioSourceType]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 1000
        style:
          $ref: '#/components/schemas/VideoStyle'
        audioSourceType:
          type: string
          enum: [upload, youtube, suno]
        audioObjectPath:
          type: [string, 'null']
        audioSourceUrl:
          type: [string, 'null']
        lyricsText:
          type: [string, 'null']
          maxLength: 5000
          description: Optional lyrics to overlay on the generated video
        aspectRatio:
          type: [string, 'null']
          enum: ['16:9', '9:16', '1:1', '4:3', '21:9', null]
          description: Output video aspect ratio (defaults to 16:9)
        resolution:
          type: [string, 'null']
          enum: ['720p', '1080p', null]
          description: Output video resolution (defaults to 720p)
        character:
          type: [string, 'null']
          maxLength: 100
          description: Optional character type to feature in the video
        removeWatermark:
          type: [boolean, 'null']
          description: Whether to remove the provider watermark from generated clips
        referenceImagePath:
          type: [string, 'null']
          description: Object storage path for an optional reference image used as Runway starting frame

    JobListResponse:
      type: object
      required: [jobs, total, page, limit]
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Video:
      type: object
      required: [id, userId, jobId, videoObjectPath, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        jobId:
          type: string
        videoObjectPath:
          type: string
        thumbnailObjectPath:
          type: [string, 'null']
        title:
          type: [string, 'null']
        durationSeconds:
          type: [number, 'null']
        style:
          type: [string, 'null']
        prompt:
          type: [string, 'null']
        shareToken:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time

    VideoListResponse:
      type: object
      required: [videos, total, page, limit]
      properties:
        videos:
          type: array
          items:
            $ref: '#/components/schemas/Video'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    CreditsResponse:
      type: object
      required: [creditsRemaining, creditsUsed, totalGenerations]
      properties:
        creditsRemaining:
          type: integer
        creditsUsed:
          type: integer
        totalGenerations:
          type: integer

    DashboardStats:
      type: object
      required: [totalJobs, completedJobs, processingJobs, failedJobs, totalVideos, creditsRemaining]
      properties:
        totalJobs:
          type: integer
        completedJobs:
          type: integer
        processingJobs:
          type: integer
        failedJobs:
          type: integer
        totalVideos:
          type: integer
        creditsRemaining:
          type: integer
        recentJobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
