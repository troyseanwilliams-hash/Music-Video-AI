openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BeatVision AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Jobs
    description: Music video generation jobs
  - name: Videos
    description: Generated videos gallery
  - name: Generated Images
    description: Private generated-image library and public Explore gallery
  - name: Credits
    description: User credits and usage
  - name: Billing
    description: Stripe subscriptions, top-ups, and customer portal
  - name: Suite
    description: Shared AISync Suite subscriptions and cross-product account linking
  - name: Audio
    description: Audio file analysis
  - name: Studio
    description: Remix project editing and persistence
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /admin/images:
    get:
      tags: [Generated Images]
      operationId: listAdminImages
      summary: List generated images for community-guideline review
      description: Returns non-deleted generated images and owner context to administrators only.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 24
        - name: search
          in: query
          description: Search image prompts and creator email addresses.
          schema:
            type: string
            maxLength: 160
      responses:
        '200':
          description: Generated images available for administrator review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminImageAssetListResponse'
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Administrator access required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register a new account with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registered and signed in successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Email already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and redirect home
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to home page.

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List all jobs for the current user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: List of jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [Jobs]
      operationId: createJob
      summary: Create a new music video generation job
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job created and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '402':
          description: Insufficient credits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /image-packs:
    post:
      tags: [Jobs]
      operationId: createImagePack
      summary: Generate a reusable pack of portrait or landscape AI images
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImagePackRequest'
      responses:
        '201':
          description: Image pack created and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Invalid image pack request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '402':
          description: Insufficient credits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /photo-animations/quote:
    post:
      tags: [Jobs]
      operationId: quotePhotoAnimation
      summary: Validate and price one source-image animation without charging credits
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoAnimationQuoteRequest'
      responses:
        '200':
          description: Exact safe prompt and credit quote for approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoAnimationQuote'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Invalid source image or blocked prompt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Requested provider is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /photo-animations:
    post:
      tags: [Jobs]
      operationId: createPhotoAnimation
      summary: Reserve credits and queue one approved source-image animation
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePhotoAnimationRequest'
      responses:
        '201':
          description: Animation job created and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoAnimationJob'
        '200':
          description: Existing job returned for an identical idempotent retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoAnimationJob'
        '400':
          description: Invalid or unapproved request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '402':
          description: Insufficient credits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Stale quote, changed source, or idempotency mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Invalid source image or blocked prompt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Requested provider is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /photo-animations/operations/{idempotencyKey}:
    get:
      tags: [Jobs]
      operationId: getPhotoAnimationOperation
      summary: Look up a photo animation submission by its durable operation key
      description: A 404 does not authorize replacing the original key; a submit may still be validating and retaining its source before entering the serialized transaction.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: idempotencyKey
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The authenticated user's operation was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoAnimationJob'
        '400':
          description: Invalid operation key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No operation with that key belongs to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /image-packs/plan:
    post:
      tags: [Jobs]
      operationId: planImagePack
      summary: Plan an editable generated-image storyboard without reserving credits
      description: Returns the exact ordered scene prompts to approve before creating a charged image pack.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagePackPlanRequest'
      responses:
        '200':
          description: Image storyboard planned; no credits have been reserved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagePackPlan'
        '400':
          description: Invalid planning request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /image-assets:
    get:
      tags: [Jobs]
      operationId: listImageAssets
      summary: List reusable generated images for the current user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 30
        - name: jobId
          in: query
          description: Optionally return only generated images from this owner-scoped job.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Generated images owned by the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageAssetListResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /image-assets/{id}:
    delete:
      tags: [Jobs]
      operationId: deleteImageAsset
      summary: Delete a reusable generated image
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Image deleted.
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Image not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /image-assets/{id}/visibility:
    patch:
      tags: [Generated Images]
      operationId: updateImageAssetVisibility
      summary: Publish or unpublish a generated image (owner or admin)
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratedImageVisibilityUpdate'
      responses:
        '200':
          description: Visibility updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedImageVisibility'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: Forbidden.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Generated image not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /image-assets/{id}/like:
    post:
      tags: [Generated Images]
      operationId: likeImageAsset
      summary: Like a public generated image
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Liked (idempotent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeResponse' }
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Public generated image not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      tags: [Generated Images]
      operationId: unlikeImageAsset
      summary: Remove a like from a generated image
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Unliked (idempotent).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LikeResponse' }
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Public generated image not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /image-gallery:
    get:
      tags: [Generated Images]
      operationId: listPublicImageAssets
      summary: List public generated images (no authentication required)
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 48 }
      responses:
        '200':
          description: Public generated images sorted by likes then recency.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicImageAssetListResponse' }

  /image-gallery/{id}:
    get:
      tags: [Generated Images]
      operationId: getPublicImageAsset
      summary: Get stable public generated-image detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Public generated image detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicImageAsset' }
        '404':
          description: Public generated image not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /jobs/{id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get job status and details
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /jobs/{id}/image-review/replacements:
    post:
      tags: [Jobs]
      operationId: queueImageReviewReplacements
      summary: Queue paid replacement images for selected scenes
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageReviewReplacementRequest'
      responses:
        '202':
          description: Replacement images queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageReviewReplacementResponse'
        '402':
          description: Not enough credits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Job is not available for review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /jobs/{id}/image-review/source:
    post:
      tags: [Jobs]
      operationId: chooseImageReviewSource
      summary: Choose an owned gallery or uploaded image for a scene
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageReviewSourceRequest'
      responses:
        '200':
          description: Scene source selected.
        '409':
          description: Scene has a replacement in progress or the job changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /jobs/{id}/image-review/approve:
    post:
      tags: [Jobs]
      operationId: approveImageReview
      summary: Approve the complete canonical image set and resume animation
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Image set approved and video job requeued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '409':
          description: Job is not ready for approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /jobs/{id}/remix:
    post:
      tags: [Jobs]
      operationId: remixJob
      summary: Regenerate selected clips of a finished video
      description: >
        Regenerates only the specified clips of a completed video and re-stitches
        them with the original audio into a new video. Credits are charged
        proportionally to the number of clips regenerated, not the full job.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemixJobRequest'
      responses:
        '201':
          description: Remix job created and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemixJobResponse'
        '400':
          description: Invalid input or video has no remixable clips.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '402':
          description: Insufficient credits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /videos:
    get:
      tags: [Videos]
      operationId: listVideos
      summary: List generated videos for the current user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
