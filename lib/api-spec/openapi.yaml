            idempotencyKey:
              type: string
              format: uuid

    PhotoAnimationQuote:
      type: object
      required: [totalCredits, videoCredits, imageCredits, prompt, planFingerprint, durationSeconds, provider, resolution, aspectRatio]
      properties:
        totalCredits:
          type: integer
        videoCredits:
          type: integer
        imageCredits:
          type: integer
          const: 0
        prompt:
          type: string
        planFingerprint:
          type: string
        durationSeconds:
          type: integer
          enum: [5, 10]
        provider:
          type: string
          enum: [kling, runway]
        resolution:
          type: string
          enum: [720p]
        aspectRatio:
          type: string
          enum: ['16:9', '9:16', '1:1']

    PhotoAnimationJob:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string

    ImagePackPlanRequest:
