openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BeatVision AI API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: Jobs
    description: Music video generation jobs
  - name: Videos
    description: Generated videos gallery
  - name: Credits
    description: User credits and usage
  - name: Billing
    description: Stripe subscriptions, top-ups, and customer portal
  - name: Suite
    description: Shared AISync Suite subscriptions and cross-product account linking
  - name: Audio
    description: Audio file analysis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register a new account with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registered and signed in successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Email already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and redirect home
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to home page.

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List all jobs for the current user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: List of jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [Jobs]
      operationId: createJob
      summary: Create a new music video generation job
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '201':
          description: Job created and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '402':
          description: Insufficient credits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /jobs/{id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Get job status and details
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /jobs/{id}/remix:
    post:
      tags: [Jobs]
      operationId: remixJob
      summary: Regenerate selected clips of a finished video
      description: >
        Regenerates only the specified clips of a completed video and re-stitches
        them with the original audio into a new video. Credits are charged
        proportionally to the number of clips regenerated, not the full job.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemixJobRequest'
      responses:
        '201':
          description: Remix job created and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemixJobResponse'
        '400':
          description: Invalid input or video has no remixable clips.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '402':
          description: Insufficient credits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Job not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /videos:
    get:
      tags: [Videos]
      operationId: listVideos
      summary: List generated videos for the current user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: List of videos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoListResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /videos/{id}:
    get:
      tags: [Videos]
      operationId: getVideo
      summary: Get a specific video
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Video details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Video not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [Videos]
      operationId: deleteVideo
      summary: Delete a video
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Video deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Video not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /gallery:
    get:
      tags: [Videos]
      operationId: listGallery
      summary: List public videos (no authentication required)
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 48
      responses:
        '200':
          description: Public videos sorted by like count then recency.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GalleryListResponse'

  /videos/{id}/visibility:
    patch:
      tags: [Videos]
      operationId: updateVideoVisibility
      summary: Toggle a video's public visibility (owner or admin)
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVisibilityRequest'
      responses:
        '200':
          description: Visibility updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoVisibility'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Video not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /videos/{id}/like:
    post:
      tags: [Videos]
      operationId: likeVideo
      summary: Like a public video
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Liked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [Videos]
      operationId: unlikeVideo
      summary: Remove a like from a video
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unliked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /credits:
    get:
      tags: [Credits]
      operationId: getCredits
      summary: Get current user's credit balance and usage stats
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Credits info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditsResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /referrals/me:
    get:
      tags: [Credits]
      operationId: getMyReferrals
      summary: Get current user's referral code, share stats, and reward config
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Referral info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralInfoResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /billing/plans:
    get:
      tags: [Billing]
      operationId: listBillingPlans
      summary: List available subscription plans and top-up packs
      responses:
        '200':
          description: Available plans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPlansResponse'

  /billing/subscription:
    get:
      tags: [Billing]
      operationId: getBillingSubscription
      summary: Get the current user's subscription summary
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Subscription summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingSubscriptionResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /billing/checkout:
    post:
      tags: [Billing]
      operationId: createBillingCheckout
      summary: Create a Stripe Checkout session for a subscription or top-up
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutRequest'
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCheckoutResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /billing/grants:
    get:
      tags: [Billing]
      operationId: listBillingGrants
      summary: List credit grants for the current user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: List of credit grants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditGrantsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /billing/portal:
    post:
      tags: [Billing]
      operationId: createBillingPortalSession
      summary: Create a Stripe Billing Portal session for the current user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePortalRequest'
      responses:
        '200':
          description: Portal session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePortalResponse'
        '400':
          description: User has no Stripe customer record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /suite/status:
    get:
      tags: [Suite]
      operationId: getSuiteStatus
      summary: Get the current user's AISync Suite link and subscription status
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Suite account and subscription status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuiteStatus'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /suite/link/authorize:
    post:
      tags: [Suite]
      operationId: authorizeSuiteLink
      summary: Authorize a pending AIPodSync account-link request
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuiteLinkAuthorizationInput'
      responses:
        '200':
          description: One-time account-link redirect created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuiteLinkAuthorizationResponse'
        '400':
          description: Invalid or disallowed account-link request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /suite/checkout:
    post:
      tags: [Suite]
      operationId: createSuiteCheckout
      summary: Create checkout for a linked AISync Suite account
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuiteCheckoutInput'
      responses:
        '200':
          description: Suite checkout session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuiteBillingUrlResponse'
        '400':
          description: Invalid request or accounts are not linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: An overlapping subscription prevents checkout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /suite/portal:
    post:
      tags: [Suite]
      operationId: createSuitePortal
      summary: Create a billing portal session for an AISync Suite subscriber
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuitePortalInput'
      responses:
        '200':
          description: Suite billing portal session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuiteBillingUrlResponse'
        '400':
          description: No billing customer exists for the account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /audio/analyze:
    post:
      tags: [Audio]
      operationId: analyzeAudio
      summary: Analyse an uploaded audio file and return BPM, mood, energy, and section structure
      description: Fetches the audio from object storage and runs server-side ffmpeg + autocorrelation analysis. Call this after the file is uploaded via the presigned URL.
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioAnalyzeRequest'
      responses:
        '200':
          description: Audio analysis complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioAnalysis'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Audio file not found in object storage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Audio could not be decoded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /dashboard/stats:
    get:
      tags: [Jobs]
      operationId: getDashboardStats
      summary: Get dashboard summary stats for the current user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Dashboard stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, subscriptionStatus, isAdmin]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        subscriptionStatus:
          type: string
          enum: [trial, active, cancelled, none]
          description: Current subscription state of the user
        trialEndsAt:
          type: [string, 'null']
          format: date-time
          description: When the free trial expires (null means no expiry set)
        isAdmin:
          type: boolean
          description: Whether the user has admin/power-user privileges
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          minLength: 5
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
          maxLength: 100
        referralCode:
          type: string
          maxLength: 32
          description: Optional referral code captured from a ?ref= share link.
    ReferralInfoResponse:
      type: object
      required: [code, referredCount, creditsEarned, rewardPerReferral, referredBonus, maxCreditedReferrals]
      properties:
        code:
          type: string
        referredCount:
          type: integer
        creditsEarned:
          type: integer
        rewardPerReferral:
          type: integer
        referredBonus:
          type: integer
        maxCreditedReferrals:
          type: integer
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'

    AudioAnalyzeRequest:
      type: object
      required: [objectPath]
      properties:
        objectPath:
          type: string
          description: Object storage path of the uploaded audio file (e.g. /objects/uploads/uuid.mp3)

    JobStatus:
      type: string
      enum: [pending_approval, queued, analyzing, generating, stitching, ready, failed]

    VideoStyle:
      type: string
      enum: [realistic, anime, cinematic, abstract, neon, vintage, fantasy, documentary]

    AudioAnalysis:
      type: object
      properties:
        analysisReceipt:
          type: string
          maxLength: 512
          description: Server-signed receipt binding this analysis to the authenticated user and stored audio object
        bpm:
          type: [number, 'null']
        key:
          type: [string, 'null']
        energy:
          type: [number, 'null']
        mood:
          type: [string, 'null']
        durationSeconds:
          type: [number, 'null']
        beatTimestamps:
          type: array
          items:
            type: number
        sections:
          type: array
          items:
            type: object
            properties:
              startTime:
                type: number
              endTime:
                type: number
              label:
                type: string
              energy:
                type: number
            required: [startTime, endTime, label, energy]

    Job:
      type: object
      required: [id, userId, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        jobType:
          type: [string, 'null']
          description: Processing flow used for this job, such as editor_render for a Remix Lab export
        aiProvider:
          type: [string, 'null']
          enum: [runway, kling, luma, null]
        resolution:
          type: [string, 'null']
          enum: ['720p', '1080p', '4k', null]
        status:
          $ref: '#/components/schemas/JobStatus'
        audioSourceType:
          type: [string, 'null']
          enum: [upload, youtube, suno, none, null]
        audioObjectPath:
          type: [string, 'null']
        audioSourceUrl:
          type: [string, 'null']
        prompt:
          type: [string, 'null']
        style:
          type: [string, 'null']
        audioAnalysis:
          oneOf:
            - $ref: '#/components/schemas/AudioAnalysis'
            - type: 'null'
        progressPercent:
          type: [integer, 'null']
        errorMessage:
          type: [string, 'null']
        videoId:
          type: [string, 'null']
        clips:
          type: array
          description: Per-clip metadata for the finished video (present when status is ready). Used by the remix UI to list individual clips.
          items:
            $ref: '#/components/schemas/VideoClip'
        lyricsText:
          type: [string, 'null']
        referenceImagePath:
          type: [string, 'null']
          description: Object storage path for an optional reference image
        requestedDuration:
          type: [string, 'null']
          enum: ['5', '8', '10', '30', '45', '60', '90', '120', '300', '600', 'full', null]
          description: Requested output video length
        clipStartTime:
          type: [number, 'null']
          minimum: 0
          description: Audio clip start time in seconds; null means start from the beginning
        claimedAt:
          type: [string, 'null']
          format: date-time
          description: Time a worker claimed the job; null while the job is queued
        manifest:
          oneOf:
            - $ref: '#/components/schemas/JobManifest'
            - type: 'null'
        previewClips:
          type: object
          description: Completed scene index to preview URL, present while scenes are generated
          additionalProperties:
            type: string
        videoUrl:
          type: string
          description: Signed or proxied playback URL, present when the finished video is available
        hasAudio:
          type: boolean
          description: Whether the finished render contains a soundtrack
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JobManifest:
      type: object
      additionalProperties: true
      properties:
        segments:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              kind:
                type: string
                enum: [video, photo]
              durationSec:
                type: number
              trimStart:
                type: number
              trimEnd:
                type: number
        transition:
          type: object
          additionalProperties: true
          properties:
            type:
              type: string
            durationSec:
              type: number
        resolution:
          type: string
        lyricsText:
          type: [string, 'null']
        clipIndexes:
          type: array
          items:
            type: integer
        storyboard:
          $ref: '#/components/schemas/JobStoryboard'
        bundledLipSyncChildId:
          type: string
        bundledLipSyncEnabled:
          type: boolean
        baseCreditCost:
          type: integer
          minimum: 0
        bundledLipSyncCost:
          type: integer
          minimum: 0
        bundledLipSyncActivated:
          type: boolean

    JobStoryboard:
      type: object
      required: [generationMode, numClips, clipDurationSec, targetOutputDuration, shots, approximate]
      properties:
        generationMode:
          type: string
          enum: [montage, narrative]
        numClips:
          type: integer
          minimum: 1
        clipDurationSec:
          type: number
          minimum: 0
        targetOutputDuration:
          type: number
          minimum: 0
        approximate:
          type: boolean
        timelineSceneCount:
          type: integer
          minimum: 1
        reuseCount:
          type: integer
          minimum: 0
        shots:
          type: array
          items:
            $ref: '#/components/schemas/JobStoryboardShot'

    JobStoryboardShot:
      type: object
      required: [index, label, startTime, energy, prompt]
      properties:
        index:
          type: integer
          minimum: 0
        label:
          type: string
        description:
          type: string
          description: Short, human-readable description of the exact planned scene or visual.
        startTime:
          type: number
          minimum: 0
        energy:
          type: number
          minimum: 0
          maximum: 1
        prompt:
          type: string

    CreateJobRequest:
      type: object
      required: [prompt, style, audioSourceType]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 1000
        style:
          $ref: '#/components/schemas/VideoStyle'
        audioSourceType:
          type: string
          enum: [upload, youtube, suno, none]
        audioObjectPath:
          type: [string, 'null']
        audioSourceUrl:
          type: [string, 'null']
        lyricsText:
          type: [string, 'null']
          maxLength: 50000
          description: Optional lyrics to overlay on the generated video
        aspectRatio:
          type: [string, 'null']
          enum: ['16:9', '9:16', '1:1', '4:3', '21:9', null]
          description: Output video aspect ratio (defaults to 16:9)
        resolution:
          type: [string, 'null']
          enum: ['720p', '1080p', '4k', null]
          description: Output video resolution (defaults to 720p)
        character:
          type: [string, 'null']
          maxLength: 100
          description: Optional character type to feature in the video
        referenceImagePath:
          type: [string, 'null']
          description: Object storage path for an optional reference image used as Runway starting frame
        requestedDuration:
          type: [string, 'null']
          enum: ['5', '8', '10', '30', '45', '60', '90', '120', '300', '600', 'full', null]
          description: Requested output video length. '5'/'8'/'10' = short clip, '30'/'60'/'90'/'120' = multi-clip stitch, 'full' = full audio length (default; not valid when audioSourceType is "none", since there is no audio to derive a length from)
        generationMode:
          type: string
          enum: [montage, narrative]
          default: montage
          description: Montage intentionally reuses a smaller visual library; Narrative renders one unique chronological scene per timeline slot.
        clipStartTime:
          type: [number, 'null']
          minimum: 0
          description: Audio clip start time in seconds; null or omit means start from the beginning
        audioAnalysis:
          oneOf:
            - $ref: '#/components/schemas/AudioAnalysis'
            - type: 'null'
          description: Pre-computed audio analysis from POST /audio/analyze. The server verifies its signed receipt against audioObjectPath before using it for planning or billing.
        aiProvider:
          type: [string, 'null']
          enum: ['runway', 'kling', 'luma', null]
          description: Preferred AI video generation provider; falls back to the server-configured active provider if not set or unavailable
        fullTrackLipSyncEnabled:
          type: boolean
          default: false
          description: When true, reserve the Lip Sync add-on with the source video and automatically create a separate Lip Sync video
        fullTrackLipSyncSeconds:
          type: integer
          minimum: 5
          maximum: 30
          default: 15
          description: Duration of the bundled Lip Sync performance
        fullTrackLipSyncStartTime:
          type: number
          minimum: 0
          default: 0
          description: Start time of the bundled Lip Sync song segment
        fullTrackLipSyncImagePath:
          type: [string, 'null']
          description: Object storage path for the face image used by the bundled Lip Sync video

    VideoClip:
      type: object
      required: [index, startTime, endTime, durationSec, prompt, objectPath]
      properties:
        index:
          type: integer
          description: Zero-based position of this clip in the timeline
        startTime:
          type: number
          description: Clip start time in seconds within the finished video
        endTime:
          type: number
          description: Clip end time in seconds within the finished video
        durationSec:
          type: number
        prompt:
          type: string
          description: The prompt used to generate this clip
        style:
          type: [string, 'null']
        objectPath:
          type: string
          description: Object storage path of the stored clip, reused on remix

    RemixJobRequest:
      type: object
      required: [clipIndexes]
      properties:
        clipIndexes:
          type: array
          minItems: 1
          maxItems: 64
          description: Indexes of the clips to regenerate
          items:
            type: integer
            minimum: 0
        style:
          $ref: '#/components/schemas/VideoStyle'
        promptOverride:
          type: string
          maxLength: 1000
          description: Optional prompt applied to the regenerated clips
        lyricsText:
          type: string
          maxLength: 50000
          description: >-
            Karaoke captions burned into the remixed video. Omitted = inherit the
            original job's lyrics; empty string = clear them.
        acceptCopyright:
          type: boolean
          description: Required (true) whenever the remix will burn lyrics.

    RemixJobResponse:
      type: object
      required: [job, remixCost, charged]
      properties:
