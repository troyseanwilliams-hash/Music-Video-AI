components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string

  schemas:
    StudioSegment:
      type: object
      additionalProperties: false
      required: [name, kind, objectPath, durationSec]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [video, photo] }
        objectPath: { type: string, minLength: 1 }
        durationSec: { type: number, exclusiveMinimum: 0, maximum: 1800 }
        trimStart: { type: number, minimum: 0, maximum: 1800 }
        trimEnd: { type: number, minimum: 0, maximum: 1800 }
        sourceVideoId: { type: [string, 'null'] }
    StudioVideoOverlay:
      type: object
      additionalProperties: false
      required: [id, name, objectPath, startSec, durationSec, trimStart, x, y, width, height, layout, volume, cornerRadius, borderWidth, borderColor]
      properties:
        kind: { type: string, enum: [video, image], description: "Omitted for legacy video overlays. Images display for durationSec with no audio or source trim." }
        id: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 120 }
        objectPath: { type: string, minLength: 1 }
        startSec: { type: number, minimum: 0, maximum: 1800 }
        durationSec: { type: number, exclusiveMinimum: 0, maximum: 1800 }
        trimStart: { type: number, minimum: 0, maximum: 1800 }
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        width: { type: number, exclusiveMinimum: 0, maximum: 1 }
        height: { type: number, exclusiveMinimum: 0, maximum: 1 }
        layout: { type: string, enum: [custom, reaction, commentary, center16x9] }
        volume: { type: number, minimum: 0, maximum: 1 }
        cornerRadius: { type: number, minimum: 0, maximum: 0.25 }
        borderWidth: { type: number, minimum: 0, maximum: 0.02 }
        borderColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
    StudioTextCard:
      type: object
      additionalProperties: false
      required: [id, text, startSec, durationSec, x, y, fontSize, color, backgroundColor]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        text: { type: string, minLength: 1, maxLength: 500 }
        startSec: { type: number, minimum: 0, maximum: 1800 }
        durationSec: { type: number, exclusiveMinimum: 0, maximum: 1800 }
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        fontSize: { type: number, minimum: 0.01, maximum: 0.15 }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        backgroundColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
    StudioAudioClip:
      type: object
      additionalProperties: false
      required: [id, name, objectPath, startSec, durationSec, trimStart, volume]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 120 }
        objectPath: { type: string, minLength: 1 }
        startSec: { type: number, minimum: 0, maximum: 1800 }
        durationSec: { type: number, exclusiveMinimum: 0, maximum: 1800 }
        trimStart: { type: number, minimum: 0, maximum: 1800 }
        volume: { type: number, minimum: 0, maximum: 1 }
        fadeInSec: { type: number, minimum: 0, maximum: 1800 }
        fadeOutSec: { type: number, minimum: 0, maximum: 1800 }
    StudioMusic:
      type: object
      additionalProperties: false
      required: [name, objectPath, mode, volume, loop, fade]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        objectPath: { type: string, minLength: 1 }
        mode: { type: string, enum: [mix, replace] }
        volume: { type: number, minimum: 0, maximum: 1 }
        loop: { type: boolean }
        fade: { type: boolean }
    StudioTransition:
      type: object
      additionalProperties: false
      required: [type, durationSec]
      properties:
        type: { type: string, enum: [none, crossfade, fadeblack, fadewhite, dissolve, pixelize, wipeleft, wiperight, wipeup, wipedown, slideleft, slideright, slideup, slidedown, circleopen, circleclose, radial, wipe, slide, circle, zoomin] }
        durationSec: { type: number, minimum: 0.2, maximum: 2 }
    StudioProjectManifest:
      type: object
      additionalProperties: false
      required: [version, segments, transition, resolution, orientation, videoName, sourceVideoId, karaokeEnabled, lyricsText, lyricsSyncSource, beatsPerPhoto]
      properties:
        version: { type: integer, const: 1 }
        audioClips:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/StudioAudioClip' }
        overlays:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/StudioVideoOverlay' }
        textCards:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/StudioTextCard' }
        segments:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/StudioSegment' }
        music:
          oneOf:
            - $ref: '#/components/schemas/StudioMusic'
            - type: 'null'
        transition: { $ref: '#/components/schemas/StudioTransition' }
        resolution: { type: string, enum: [720p, 1080p] }
        orientation: { type: string, enum: [landscape, portrait] }
        videoName: { type: string, maxLength: 120 }
        sourceVideoId: { type: [string, 'null'] }
        karaokeEnabled: { type: boolean }
        lyricsText: { type: string, maxLength: 50000 }
        lyricsSyncSource: { type: string, enum: [music, video] }
        beatsPerPhoto: { type: number, exclusiveMinimum: 0, maximum: 128 }
    StudioProjectInput:
      type: object
      additionalProperties: false
      required: [name, manifest]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        manifest: { $ref: '#/components/schemas/StudioProjectManifest' }
    StudioProjectUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        manifest: { $ref: '#/components/schemas/StudioProjectManifest' }
    StudioProject:
      type: object
      required: [id, name, manifest, lastVideoId, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        manifest: { $ref: '#/components/schemas/StudioProjectManifest' }
        lastVideoId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StudioProjectSummary:
      type: object
      required: [id, name, lastVideoId, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        lastVideoId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, subscriptionStatus, isAdmin]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        subscriptionStatus:
          type: string
          enum: [trial, active, cancelled, none]
          description: Current subscription state of the user
        trialEndsAt:
          type: [string, 'null']
          format: date-time
          description: When the free trial expires (null means no expiry set)
        isAdmin:
          type: boolean
          description: Whether the user has admin/power-user privileges
    AuthUserEnvelope:
      type: object
      required: [user]
