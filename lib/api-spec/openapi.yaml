        style:
          $ref: '#/components/schemas/VideoStyle'
        imageCount:
          type: integer
          minimum: 1
          maximum: 30
        aspectRatio:
          type: string
          enum: ['9:16', '16:9']
          default: '9:16'
        referenceImagePath:
          type: string
          nullable: true

    ImagePackScene:
      type: object
