        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    GeneratedImageVisibilityUpdate:
      type: object
      required: [isPublic]
      properties:
        isPublic: { type: boolean }
        isCreatorAnonymous:
          type: boolean
          description: Hide the creator's profile name on public Explore surfaces.

    GeneratedImageVisibility:
      type: object
      required: [id, isPublic, isCreatorAnonymous]
      properties:
        id: { type: string }
        isPublic: { type: boolean }
        isCreatorAnonymous: { type: boolean }

    JobManifest:
      type: object
      additionalProperties: true
      properties:
        segments:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              kind:
                type: string
                enum: [video, photo]
              durationSec:
                type: number
              trimStart:
                type: number
              trimEnd:
                type: number
        transition:
          type: object
          additionalProperties: true
          properties:
            type:
              type: string
            durationSec:
              type: number
        resolution:
          type: string
        lyricsText:
          type: [string, 'null']
        clipIndexes:
          type: array
          items:
            type: integer
        storyboard:
          $ref: '#/components/schemas/JobStoryboard'
        imageFirstVersion:
          type: integer
          enum: [1]
          description: Present when every video scene is animated from a persisted source-image plan.
        imageReview:
          $ref: '#/components/schemas/ImageReview'
        imageCreditCost:
          type: integer
          minimum: 0
        videoCreditCost:
          type: integer
          minimum: 0
        narrativeImages:
          type: object
          description: Planned visual index to owner-protected source-image object path.
          additionalProperties:
            type: string
        bundledLipSyncChildId:
          type: string
        bundledLipSyncEnabled:
          type: boolean
        baseCreditCost:
          type: integer
          minimum: 0
        bundledLipSyncCost:
          type: integer
          minimum: 0
        bundledLipSyncActivated:
          type: boolean

    ImageReviewScene:
      type: object
      required: [index, revision, source, prompt, status]
      properties:
        index: { type: integer, minimum: 0 }
        canonicalPath: { type: string }
        revision: { type: integer, minimum: 1 }
        source:
          type: string
          enum: [original_generation, regenerated, generated_gallery, local_upload]
        prompt: { type: string }
        status:
          type: string
          enum: [ready, failed, pending, uncertain]
        errorMessage: { type: string }
        acceptedRequestId: { type: string }

    ImageReview:
      type: object
      required: [phase, revision, scenes]
      properties:
        phase:
          type: string
          enum: [awaiting_approval, approved]
        revision: { type: integer, minimum: 1 }
        approvedRevision: { type: integer, minimum: 1 }
        scenes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ImageReviewScene'

    ImageReviewReplacement:
      type: object
      required: [index, prompt]
      properties:
        index: { type: integer, minimum: 0 }
        prompt:
          type: string
          minLength: 1
          maxLength: 1000

    ImageReviewReplacementRequest:
      type: object
      required: [scenes]
      properties:
        scenes:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: '#/components/schemas/ImageReviewReplacement'

    ImageReviewReplacementResponse:
      type: object
      required: [ok, credits, count]
      properties:
        ok: { type: boolean, const: true }
        credits:
          type: integer
          minimum: 1
          description: Total credits reserved for the new image generations.
        count: { type: integer, minimum: 1 }

    ImageReviewSourceRequest:
      type: object
      required: [index, source]
      properties:
        index: { type: integer, minimum: 0 }
        source:
          type: string
          enum: [gallery, upload]
        imageAssetId: { type: string }
        objectPath: { type: string }

    JobStoryboard:
      type: object
      required: [generationMode, numClips, clipDurationSec, targetOutputDuration, shots, approximate]
      properties:
        generationMode:
          type: string
          enum: [montage, narrative]
        numClips:
          type: integer
          minimum: 1
        clipDurationSec:
          type: number
          minimum: 0
        targetOutputDuration:
          type: number
          minimum: 0
        approximate:
          type: boolean
        timelineSceneCount:
          type: integer
          minimum: 1
        reuseCount:
          type: integer
          minimum: 0
        shots:
          type: array
          items:
            $ref: '#/components/schemas/JobStoryboardShot'

    JobStoryboardShot:
      type: object
      required: [index, label, startTime, energy, prompt]
      properties:
        index:
          type: integer
          minimum: 0
        label:
          type: string
        description:
          type: string
          description: Short, human-readable description of the exact planned scene or visual.
        startTime:
          type: number
          minimum: 0
        energy:
          type: number
          minimum: 0
          maximum: 1
        prompt:
          type: string

    CreateJobRequest:
      type: object
      required: [prompt, style, audioSourceType, scriptApproved]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 12000
          description: Creative direction or a consecutively numbered scene script with one scene per line
        style:
          $ref: '#/components/schemas/VideoStyle'
        audioSourceType:
          type: string
          enum: [upload, youtube, suno, none]
        audioObjectPath:
          type: [string, 'null']
        audioSourceUrl:
          type: [string, 'null']
        lyricsText:
          type: [string, 'null']
          maxLength: 50000
          description: Optional lyrics to overlay on the generated video
        aspectRatio:
          type: [string, 'null']
          enum: ['16:9', '9:16', '1:1', '4:3', '21:9', null]
          description: Output video aspect ratio (defaults to 16:9)
        resolution:
          type: [string, 'null']
          enum: ['720p', '1080p', '4k', null]
          description: Output video resolution (defaults to 720p)
        character:
          type: [string, 'null']
          maxLength: 100
          description: Optional character type to feature in the video
        referenceImagePath:
          type: [string, 'null']
          description: Object storage path for an optional reference image used as Runway starting frame
        requestedDuration:
          type: [string, 'null']
          enum: ['3', '5', '8', '10', '30', '45', '60', '90', '120', '300', '600', 'full', null]
          description: Requested output video length. '5'/'8'/'10' = short clip, '30'/'60'/'90'/'120' = multi-clip stitch, 'full' = full audio length (default; not valid when audioSourceType is "none", since there is no audio to derive a length from)
        silentFilmDurationSeconds:
          type: [integer, 'null']
          minimum: 3
          maximum: 600
          description: Configurable output duration in seconds for a no-audio video. Used instead of requestedDuration when audioSourceType is none.
        generationMode:
          type: string
          enum: [montage, narrative]
          default: montage
          description: Montage intentionally reuses a smaller visual library; Narrative renders one unique chronological scene per timeline slot.
        narrativeVisualSource:
          type: string
          enum: [video, generated_images]
          default: video
          description: Narrative-only visual source. generated_images creates one persisted AI still per chronological scene and animates it into the final video.
        clipStartTime:
          type: [number, 'null']
          minimum: 0
          description: Audio clip start time in seconds; null or omit means start from the beginning
        audioAnalysis:
          oneOf:
            - $ref: '#/components/schemas/AudioAnalysis'
            - type: 'null'
          description: Pre-computed audio analysis from POST /audio/analyze. The server verifies its signed receipt against audioObjectPath before using it for planning or billing.
        aiProvider:
          type: [string, 'null']
          enum: ['runway', 'kling', 'kling_v4', 'luma', null]
          description: Preferred AI video generation provider; falls back to the server-configured active provider if not set or unavailable
        endFrameImageAssetId:
          type: [string, 'null']
          maxLength: 64
          description: Optional owned gallery image used as the final scene's ending frame for Kling 4.0 only.
        fullTrackLipSyncEnabled:
          type: boolean
          default: false
          description: When true, reserve the Lip Sync add-on with the source video and automatically create a separate Lip Sync video
        fullTrackLipSyncSeconds:
          type: integer
          minimum: 5
          maximum: 30
          default: 15
          description: Duration of the bundled Lip Sync performance
        fullTrackLipSyncStartTime:
          type: number
          minimum: 0
          default: 0
          description: Start time of the bundled Lip Sync song segment
        fullTrackLipSyncImagePath:
          type: [string, 'null']
          description: Object storage path for the face image used by the bundled Lip Sync video
        approvedScenePlanFingerprint:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Fingerprint returned by the no-charge scene prompt planning step. Required when approvedScenePrompts is submitted.
        approvedScenePrompts:
          type: array
          minItems: 1
          maxItems: 60
          description: Exact ordered scene prompts reviewed by the user. The server validates them against the current authoritative scene plan before reserving credits.
          items:
            type: object
            required: [index, prompt]
            properties:
              index:
                type: integer
                minimum: 0
                maximum: 59
              prompt:
                type: string
                minLength: 1
                maxLength: 5000
        selectedSceneSources:
          type: array
          maxItems: 60
          description: Optional scene assignments for Narrative or Visual Montage that reuse generated images owned by the current user as exact animation sources, without a new image-generation charge.
          items:
            type: object
            required: [index, imageAssetId]
            properties:
              index:
                type: integer
                minimum: 0
                maximum: 59
              imageAssetId:
                type: string
                format: uuid
        scriptApproved:
          type: boolean
          description: Explicit user confirmation that the submitted script and scene prompts were reviewed and approved before generation.

    VideoClip:
      type: object
      required: [index, startTime, endTime, durationSec, prompt, objectPath]
      properties:
        index:
          type: integer
          description: Zero-based position of this clip in the timeline
        startTime:
          type: number
          description: Clip start time in seconds within the finished video
        endTime:
          type: number
          description: Clip end time in seconds within the finished video
        durationSec:
          type: number
        prompt:
          type: string
          description: The prompt used to generate this clip
        style:
          type: [string, 'null']
        objectPath:
          type: string
          description: Object storage path of the stored clip, reused on remix

    RemixJobRequest:
      type: object
      required: [clipIndexes]
      properties:
        clipIndexes:
          type: array
          minItems: 1
          maxItems: 64
          description: Indexes of the clips to regenerate
          items:
            type: integer
            minimum: 0
        style:
          $ref: '#/components/schemas/VideoStyle'
        promptOverride:
          type: string
          maxLength: 1000
          description: Optional prompt applied to the regenerated clips
        lyricsText:
          type: string
          maxLength: 50000
          description: >-
            Karaoke captions burned into the remixed video. Omitted = inherit the
            original job's lyrics; empty string = clear them.
        acceptCopyright:
          type: boolean
          description: Required (true) whenever the remix will burn lyrics.

    RemixJobResponse:
      type: object
      required: [job, remixCost, charged]
      properties:
        job:
          $ref: '#/components/schemas/Job'
        remixCost:
          type: integer
          description: Credits charged for this remix (proportional to clips regenerated)
        charged:
          type: boolean
          description: Whether credits were deducted (false for admins)

    JobListResponse:
      type: object
      required: [jobs, total, page, limit]
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Video:
      type: object
      required: [id, userId, jobId, videoObjectPath, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        jobId:
          type: string
        videoObjectPath:
          type: string
        thumbnailObjectPath:
          type: [string, 'null']
        title:
          type: [string, 'null']
        durationSeconds:
          type: [number, 'null']
        style:
          type: [string, 'null']
        prompt:
          type: [string, 'null']
        shareToken:
          type: [string, 'null']
        isPublic:
          type: boolean
        isCreatorAnonymous:
          type: boolean
          description: When true, the creator's profile name is hidden on public Explore surfaces.
        likeCount:
          type: integer
        hasAudio:
          type: boolean
