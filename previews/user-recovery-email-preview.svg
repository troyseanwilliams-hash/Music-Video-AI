<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1040" viewBox="0 0 720 1040">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#111827" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="720" height="1040" fill="#f3f4f6"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <rect x="30" y="30" width="660" height="138" rx="14" fill="#fff" stroke="#e5e7eb"/>
    <text x="54" y="66" font-size="14" fill="#6b7280">To</text>
    <text x="118" y="66" font-size="14" fill="#111827">ym19810926@icloud.com</text>
    <text x="54" y="101" font-size="14" fill="#6b7280">From</text>
    <text x="118" y="101" font-size="14" fill="#111827">AIBeatSync &lt;notifications@aibeatsync.com&gt;</text>
    <text x="54" y="136" font-size="14" fill="#6b7280">Subject</text>
    <text x="118" y="136" font-size="14" font-weight="700" fill="#111827">An update about your recent AIBeatSync video</text>

    <rect x="30" y="184" width="660" height="820" rx="14" fill="#fff" stroke="#e5e7eb" filter="url(#shadow)"/>

    <rect x="265" y="224" width="190" height="48" rx="12" fill="url(#brand)"/>
    <text x="360" y="255" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">AIBeatSync</text>

    <text x="82" y="326" font-size="24" font-weight="700" fill="#111111">An update about your recent video</text>

    <text x="82" y="375" font-size="16" fill="#333333">Hi,</text>

    <text x="82" y="421" font-size="16" fill="#333333">
      <tspan x="82" dy="0">We experienced an issue with our Runway API connection today</tspan>
      <tspan x="82" dy="27">that affected your recent video generation. The issue has now</tspan>
      <tspan x="82" dy="27">been resolved.</tspan>
    </text>

    <rect x="82" y="517" width="556" height="82" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="106" y="566" font-size="16" font-weight="700" fill="#4c1d95">We have refunded 2,500 credits to your account.</text>

    <text x="82" y="648" font-size="16" fill="#333333">
      <tspan x="82" dy="0">We also ensured that your latest video completed as requested</tspan>
      <tspan x="82" dy="27">and is available in your account.</tspan>
    </text>

    <text x="82" y="733" font-size="16" fill="#333333">
      <tspan x="82" dy="0">Thank you for trying AIBeatSync. We appreciate your patience</tspan>
      <tspan x="82" dy="27">and the opportunity to make this right.</tspan>
    </text>

    <text x="82" y="830" font-size="16" fill="#333333">Best,</text>
    <text x="82" y="858" font-size="16" font-weight="700" fill="#333333">AIBeatSync Admin</text>

    <line x1="82" y1="912" x2="638" y2="912" stroke="#eeeeee"/>
    <text x="82" y="944" font-size="12" fill="#999999">Questions? Just reply to this email. — The AIBeatSync team</text>
